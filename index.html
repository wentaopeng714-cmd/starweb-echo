const S=44,R=22;let bg,scale=1;

function hint(text,seconds=5){if(time<hintUntil)return;discovery.textContent=text;hintUntil=time+seconds}
function nearestNode(x,y,connected=true){let best=null,dd=Infinity;nodes.forEach((n,i)=>{if(n.anchor||(connected&&!n.connected))return;let d=Math.hypot(x-n.x,y-n.y);if(d<dd){best=i;dd=d}});return {id:best,d:dd}}

function emit(x,y,n=8){for(let i=0;i<n&&dust.length<420;i++)dust.push({x,y,vx:rand(-65,65),vy:rand(-70,35),life:rand(.4,1.4),max:1.4,size:rand(.6,1.8)})}
function ripple(x,y,power=1){rings.push({x,y,r:2,life:1,power});if(rings.length>18)rings.shift()}
function support(){const adj=nodes.map(()=>[]);for(const e of edges)if(e.alive){adj[e.a].push(e.b);adj[e.b].push(e.a)}let q=[];nodes.forEach((n,i)=>{n.connected=n.anchor;if(n.anchor)q.push(i)});for(let k=0;k<q.length;k++)for(const j of adj[q[k]])if(!nodes[j].connected){nodes[j].connected=true;q.push(j)}for(const j of jewels)if(!j.fall&&(!nodes[j.node].connected||adj[j.node].length<3)){j.fall=true;j.vx=nodes[j.node].vx+rand(-14,14);j.vy=20;dropCount++;emit(j.x,j.y,5)}}

function cut(ax,ay,bx,by){let count=0;for(const e of edges){if(!e.alive)continue;let a=nodes[e.a],b=nodes[e.b];if(intersects({x:ax,y:ay},{x:bx,y:by},a,b)||segmentDistance(a.x,a.y,ax,ay,bx,by)<5){e.alive=false;e.age=0;e.cutAt=time;e.energy=1;let dx=b.x-a.x,dy=b.y-a.y;a.vx-=dx*1.1;a.vy-=dy*1.1;b.vx+=dx*1.1;b.vy+=dy*1.1;emit((a.x+b.x)/2,(a.y+b.y)/2,3);count++}}if(count){cutCount+=count;support();note(count,.55);document.querySelector('#whisper').textContent='Even falling light leaves an echo.'}}

canvas.addEventListener('pointerdown',e=>{e.preventDefault();audioUnlock();canvas.setPointerCapture(e.pointerId);let n=nearestNode(e.clientX,e.clientY,false),mode='hold',cargo=[];if(Math.hypot(e.clientX-worker.x,e.clientY-worker.y)<36){mode='guide';guideCount++;worker.target=null;hint('Lead the weaver. Leave a new pattern.',6)}else{cargo=jewels.filter(j=>j.fall&&!j.held&&Math.hypot(j.x-e.clientX,j.y-e.clientY)<46).slice(0,10);if(cargo.length){mode='sow';collected+=cargo.length;cargo.forEach(j=>j.held=e.pointerId);hint('Carry the light onto a thread. Release.',6)}}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,prevT:e.timeStamp,start:time,node:n.d<85?n.id:null,moved:0,mode,charge:false,cargo});lastInput=time});

function step(dt){time+=dt;for(const n of nodes){if(n.anchor){n.x=n.ox+Math.sin(time*.35+n.oy)*2;n.y=n.oy;continue}n.vx+=(n.ox-n.x)*dt*3.5;n.vy+=((n.oy-n.y)*3.5+Math.sin(time*.7+n.ox*.009)*2)*dt;n.vx*=Math.exp(-dt*2.6);n.vy*=Math.exp(-dt*2.6);n.x+=n.vx*dt;n.y+=n.vy*dt}for(let iter=0;iter<3;iter++)for(const e of edges){e.energy*=1-dt*1.5;if(!e.alive){e.age+=dt/3;continue}e.grow=Math.min(1,e.grow+dt*.6);const a=nodes[e.a],b=nodes[e.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-e.len)/d*.22*e.grow;if(!a.anchor){a.x+=dx*f;a.y+=dy*f}if(!b.anchor){b.x-=dx*f;b.y-=dy*f}}for(const p of pointers.values()){if(p.mode==='drag'&&p.node!==null){const n=nodes[p.node];n.x+=(p.x-n.x)*Math.min(1,dt*20);n.y+=(p.y-n.y)*Math.min(1,dt*20);for(const e of edges)if(e.a===p.node||e.b===p.node)e.energy=.6;if(Math.random()<dt*3)note(p.node,.12)}if(p.mode==='sow'){p.cargo.forEach((j,k)=>{j.x+=(p.x+Math.cos(time*2+k*2.4)*(8+k*2)-j.x)*Math.min(1,dt*18);j.y+=(p.y+Math.sin(time*2+k*2.4)*(8+k*2)-j.y)*Math.min(1,dt*18)})}if(p.mode==='guide'){worker.x+=(p.x-worker.x)*Math.min(1,dt*18);worker.y+=(p.y-worker.y)*Math.min(1,dt*18);guideHome={x:p.x,y:p.y,until:time+12}}if(p.mode==='hold'&&p.moved<9&&time-p.start>.65)p.charge=true}

// Repair runs alongside every gesture. A fresh tear stays open for 450 ms.

if(!worker.target){let best=null,score=Infinity;for(const e of edges)if(!e.alive&&e.age>=.45){const a=nodes[e.a],b=nodes[e.b],home=guideHome&&time<guideHome.until?guideHome:null,origin=home||worker,d=Math.hypot((a.x+b.x)/2-origin.x,(a.y+b.y)/2-origin.y),priority=home?d:d/(1+2.5*Math.exp(-e.age/2));if(priority<score){score=priority;best=e}}worker.target=best;worker.phase='approach';worker.stitch=0;if(best){const a=nodes[best.a],b=nodes[best.b];worker.reverse=Math.hypot(worker.x-b.x,worker.y-b.y)<Math.hypot(worker.x-a.x,worker.y-a.y)}}

for(const j of jewels){if(j.held!==undefined&&j.held!==null)continue;if(j.fall){j.trail.push({x:j.x,y:j.y});if(j.trail.length>15)j.trail.shift();if(j.pool){j.x+=Math.sin(time*.6+j.phase)*dt*6;j.x=clamp(j.x,20,W-20);j.y=H*.79+Math.sin(time+j.phase)*7;hint('Gather fallen stars. Sow them into the web.',7)}else{j.vy+=80*dt;j.x+=j.vx*dt;j.y+=j.vy*dt;j.phase+=dt*.7;j.x=clamp(j.x,15,W-15);if(j.y>H*.79){j.pool=true;j.vy=j.vx=0}}}else{j.x=nodes[j.node].x;j.y=nodes[j.node].y;j.life=Math.min(1,j.life+dt*.5)}}

g.globalCompositeOperation='lighter';for(const m of motifs){let n=nodes[m.node];g.strokeStyle=`rgba(255,214,138,${Math.min(1,m.life/3)*.36})`;g.lineWidth=.8;g.beginPath();for(let k=0;k<=6;k++){let a=k/6*TAU+time*.06,r=17+Math.sin(time*TAU/m.interval)*3;let x=n.x+Math.cos(a)*r,y=n.y+Math.sin(a)*r;k?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}for(const j of jewels){if(j.fall&&j.trail.length>1){g.beginPath();j.trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.strokeStyle='#ffd47b30';g.lineWidth=j.size*.8;g.stroke()}g.globalAlpha=j.life*(.75+Math.sin(time*1.5+j.phase)*.25);let glow=g.createRadialGradient(j.x,j.y,0,j.x,j.y,j.size*6);glow.addColorStop(0,'#ffc9682c');glow.addColorStop(1,'#ffc96800');g.fillStyle=glow;g.fillRect(j.x-j.size*6,j.y-j.size*6,j.size*12,j.size*12);star(j.x,j.y,j.size,j.phase,j.kind)}for(const p of dust){g.globalAlpha=clamp(p.life,0,1);g.fillStyle='#ffdb95';g.fillRect(p.x,p.y,p.size,p.size)}for(const r of rings){g.globalAlpha=r.life*.32;g.lineWidth=.8;g.strokeStyle='#c1eaff';g.beginPath();g.ellipse(r.x,r.y,r.r,r.r*.84,0,0,TAU);g.stroke()}for(const p of pointers.values()){let charge=p.charge?Math.min(1,(time-p.start-.65)/1.2):.1;let radius=22+charge*65;let halo=g.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);halo.addColorStop(0,`rgba(255,218,149,${.08+charge*.2})`);halo.addColorStop(1,'#ffdf9900');g.globalAlpha=1;g.fillStyle=halo;g.fillRect(p.x-radius,p.y-radius,radius*2,radius*2);if(p.charge){g.strokeStyle='#ffe0a078';g.lineWidth=.7;g.beginPath();g.arc(p.x,p.y,12+charge*18,-Math.PI/2,-Math.PI/2+TAU*charge);g.stroke()}}
